<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos Liquid Glass</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-container">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="content-wrapper">
        <h1 class="main-title">Repositorios Clases</h1>

        <div class="top-actions">
            <div class="filter-chips">
            <button class="chip active" data-filter="all">Todos</button>
            <button class="chip" data-filter="csharp">C# WPF</button>
            <button class="chip" data-filter="unity">Unity</button>
            </div>

            <!-- Botón para agregar una nueva publicación (abre new.html) -->
            <div class="actions-right">
                <a class="add-post" href="new.html">➕ Agregar publicación</a>
            </div>
        </div>

        <!-- Configuración del repositorio de GitHub desde el que se cargan las publicaciones -->
        <!-- Edita los atributos data-owner y data-repo con tu usuario y repositorio antes de publicar en GH Pages -->
        <div id="repo-config" data-owner="tu-usuario" data-repo="tu-repo" style="display:none"></div>

        <main class="grid-container" id="posts-container">
            <!-- Las tarjetas se renderizan dinámicamente desde los Issues del repositorio configurado. -->
            <!-- Puedes dejar tarjetas estáticas aquí como fallback si lo deseas. -->
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
